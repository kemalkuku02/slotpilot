name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Run FakeLLM evaluations
        run: python evals/run.py

  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slotpilot
          POSTGRES_PASSWORD: slotpilot-test
          POSTGRES_DB: slotpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slotpilot -d slotpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://slotpilot:slotpilot-test@localhost:5432/slotpilot
      TEST_DATABASE_URL: postgresql+psycopg://slotpilot:slotpilot-test@localhost:5432/slotpilot
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Test concurrent booking constraint
        run: python -m pytest -q tests/test_postgres_concurrency.py

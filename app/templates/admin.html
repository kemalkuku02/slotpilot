<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SlotPilot — админ-панель</title>
  <style>
    :root{color-scheme:light;--ink:#17232d;--muted:#697780;--line:#e2e8eb;--paper:#fff;--canvas:#f3f6f7;--brand:#126b62;--brand-dark:#0b514b;--urgent:#a9372b;--urgent-bg:#fff0ed;--blue:#edf5ff;--green:#e9f5ef;--shadow:0 12px 35px #23363d0c}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{height:68px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1440px)/2));position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:-.02em}.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0}.connection{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.dot{width:8px;height:8px;background:#27976c;border-radius:50%;box-shadow:0 0 0 3px #e9f5ef}.dot.offline{background:#c0782e;box-shadow:0 0 0 3px #fff3e3}.layout{max-width:1440px;height:calc(100vh - 68px);min-height:600px;margin:auto;padding:22px 24px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}.inbox{display:flex;flex-direction:column;overflow:hidden}.inbox-head{padding:20px 18px 14px;border-bottom:1px solid var(--line)}.eyebrow{text-transform:uppercase;letter-spacing:.11em;font-size:10px;font-weight:750;color:var(--muted)}.inbox-title{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}.inbox-title h1{font-size:22px;letter-spacing:-.04em;margin:0}.count{background:#edf2f3;color:#43545d;border-radius:20px;padding:3px 9px;font-size:12px;font-weight:700}.filter{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}.conversation-list{overflow:auto;padding:8px}.conversation{display:block;width:100%;padding:12px;border:1px solid transparent;border-radius:11px;background:transparent;text-align:left;color:inherit;margin:2px 0}.conversation:hover{background:#f7f9f9}.conversation.active{background:#eef6f5;border-color:#d8ebe7}.conversation-top,.conversation-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px}.conversation-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.conversation-preview{color:var(--muted);font-size:12px;margin:5px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.conversation-bottom{font-size:11px;color:var(--muted)}.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#49605d}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:#36966c}.status.human:before{background:#7274a5}.status.urgent{color:var(--urgent)}.status.urgent:before{background:#d65041}.status.closed:before{background:#9aa6ac}.detail{display:flex;flex-direction:column;overflow:hidden}.empty{height:100%;display:grid;place-items:center;text-align:center;padding:32px;color:var(--muted)}.empty-mark{width:58px;height:58px;margin:0 auto 14px;border-radius:18px;background:#e9f1f1;color:var(--brand);display:grid;place-items:center;font-size:23px;font-weight:800}.empty h2{color:var(--ink);margin:0 0 6px;font-size:19px}.detail-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.person{min-width:0}.person h2{margin:5px 0 3px;font-size:22px;letter-spacing:-.035em}.person-meta{color:var(--muted);font-size:13px}.head-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 12px;font-weight:650;font-size:13px}.btn:hover{background:#f7f9f9}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-dark)}.btn.danger{color:var(--urgent);border-color:#f0d2cc}.summary{padding:15px 24px;border-bottom:1px solid var(--line);display:flex;gap:22px;flex-wrap:wrap}.summary-item{min-width:120px}.summary-label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:750}.summary-value{font-size:13px;font-weight:650;margin-top:4px}.bookings{padding:12px 24px;border-bottom:1px solid var(--line);display:flex;gap:9px;overflow:auto}.booking{min-width:205px;border:1px solid var(--line);border-radius:10px;background:#fbfcfc;padding:10px 12px}.booking-name{font-size:13px;font-weight:700}.booking-meta{font-size:11px;color:var(--muted);margin-top:4px}.booking-status{font-size:10px;color:var(--brand);font-weight:700;margin-top:6px}.messages{flex:1;min-height:140px;overflow:auto;padding:18px 24px;scroll-behavior:smooth}.message{max-width:min(680px,88%);margin:0 0 12px;padding:11px 13px;border-radius:12px;background:#f0f3f4;overflow-wrap:anywhere}.message.client{background:var(--blue);margin-left:auto}.message.admin{background:var(--green);margin-left:auto}.message.bot{background:#f1f3f4}.message-meta{font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;gap:16px}.message-text{white-space:pre-wrap}.composer{padding:14px 24px 18px;border-top:1px solid var(--line);background:#fff}.composer label{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-bottom:7px}.compose-row{display:flex;align-items:flex-end;gap:9px}.compose-row textarea{resize:vertical;min-height:46px;max-height:150px;flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}.compose-row textarea:focus,.filter:focus{border-color:#70a9a0;box-shadow:0 0 0 3px #126b6212}.send-hint{font-size:10px;color:var(--muted);margin-top:6px}.notice{position:fixed;right:22px;bottom:20px;background:#17232d;color:white;padding:11px 15px;border-radius:10px;box-shadow:var(--shadow);z-index:10;max-width:min(420px,90vw)}.notice.error{background:#8f2d25}.list-empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}.loading{color:var(--muted);padding:16px;text-align:center}
    @media(max-width:850px){.layout{grid-template-columns:290px minmax(0,1fr);padding:14px;gap:12px}.detail-head{padding:17px}.summary,.bookings{padding-left:17px;padding-right:17px}.messages{padding:16px 17px}.composer{padding:12px 17px 16px}}
    @media(max-width:650px){.topbar{height:60px;padding:0 15px}.brand small{display:none}.layout{height:auto;min-height:calc(100vh - 60px);grid-template-columns:1fr;padding:12px}.inbox{min-height:290px;max-height:38vh}.detail{min-height:65vh}.detail-head{display:block}.head-actions{justify-content:flex-start;margin-top:13px}.summary{gap:14px}.messages{min-height:260px}.message{max-width:94%}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">S</span><span>SlotPilot<small>Панель администратора</small></span></div>
    <div class="connection"><span id="connection-dot" class="dot"></span><span id="connection-label">Подключение</span></div>
  </header>
  <main class="layout">
    <aside class="panel inbox">
      <div class="inbox-head">
        <div class="eyebrow">Рабочее место</div>
        <div class="inbox-title"><h1>Обращения</h1><span id="conversation-count" class="count">0</span></div>
        <label class="eyebrow" for="status-filter">Показывать</label>
        <select id="status-filter" class="filter">
          <option value="all">Все диалоги</option>
          <option value="URGENT_HUMAN">Требуют внимания</option>
          <option value="BOT">Отвечает бот</option>
          <option value="HUMAN">На администраторе</option>
          <option value="CLOSED">Закрытые</option>
        </select>
      </div>
      <div id="conversation-list" class="conversation-list"><div class="loading">Загружаю диалоги…</div></div>
    </aside>
    <section id="detail" class="panel detail">
      <div class="empty"><div><div class="empty-mark">↗</div><h2>Выберите диалог</h2><div>Здесь появятся сообщения, данные клиента и его записи.</div></div></div>
    </section>
  </main>
  <div id="notice" class="notice" hidden></div>
  <script>
    const statusNames={BOT:"Отвечает бот",HUMAN:"На администраторе",URGENT_HUMAN:"Срочно: нужен администратор",CLOSED:"Закрыт"};
    const roleNames={client:"Клиент",bot:"Бот",admin:"Администратор"};
    let current=null, conversations=[], noticeTimer=null;
    const list=document.querySelector("#conversation-list"), detail=document.querySelector("#detail"), filter=document.querySelector("#status-filter");
    function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
    function statusClass(status){return status==="URGENT_HUMAN"?"urgent":status==="HUMAN"?"human":status==="CLOSED"?"closed":"bot"}
    function dateText(value,withTime=true){if(!value)return "—";const d=new Date(value);if(Number.isNaN(d.valueOf()))return esc(value);return new Intl.DateTimeFormat("ru-RU",withTime?{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}:{day:"2-digit",month:"long",year:"numeric"}).format(d)}
    function showNotice(message,error=false){const el=document.querySelector("#notice");el.textContent=message;el.className="notice"+(error?" error":"");el.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.hidden=true,3500)}
    async function request(url,options={}){const response=await fetch(url,options);let body={};try{body=await response.json()}catch{}if(!response.ok)throw new Error(body.detail||`Ошибка ${response.status}`);return body}
    function renderList(){const selected=String(current??"");const term=filter.value;const rows=conversations.filter(x=>term==="all"||x.status===term);document.querySelector("#conversation-count").textContent=String(rows.length);if(!rows.length){list.innerHTML='<div class="list-empty">Нет диалогов с таким статусом.</div>';return}list.innerHTML=rows.map(x=>{const last=x.last_message||"Пока нет сообщений";return `<button class="conversation ${String(x.id)===selected?"active":""}" data-id="${Number(x.id)}"><span class="conversation-top"><span class="conversation-name">${esc(x.client_name||`Клиент ${x.client_id}`)}</span><span class="status ${statusClass(x.status)}">${esc(statusNames[x.status]||x.status)}</span></span><span class="conversation-preview">${esc(last)}</span><span class="conversation-bottom"><span>${esc(x.channel)}</span><span>${dateText(x.updated_at)}</span></span></button>`}).join("");list.querySelectorAll("[data-id]").forEach(button=>button.addEventListener("click",()=>openChat(Number(button.dataset.id))))}
    async function loadConversations(){try{conversations=await request("/admin/api/conversations");renderList()}catch(error){showNotice(error.message,true)}}
    function renderConversation(x,preserve={}){
      const priorMessages=document.querySelector("#messages");const wasAtBottom=priorMessages&&priorMessages.scrollHeight-priorMessages.scrollTop-priorMessages.clientHeight<70;const priorTop=priorMessages?.scrollTop||0;
      const oldInput=document.querySelector("#reply");const draft=preserve.draft??oldInput?.value??"";const hadFocus=preserve.focused??(oldInput===document.activeElement);const selection=oldInput?[oldInput.selectionStart,oldInput.selectionEnd]:[draft.length,draft.length];
      const status=statusNames[x.status]||x.status;const bookings=x.bookings||[];const messages=x.messages||[];
      const bookingHtml=bookings.length?bookings.map(b=>`<article class="booking"><div class="booking-name">${esc(b.service_name)}</div><div class="booking-meta">${dateText(b.start_at,true)}${b.price?` · ${esc(b.price)} ₽`:""}</div><div class="booking-status">${esc(b.status)}</div></article>`).join(""):'<div class="booking-meta">Записей пока нет</div>';
      const messageHtml=messages.map(m=>`<article class="message ${esc(m.role)}"><div class="message-meta"><span>${esc(roleNames[m.role]||m.role)}</span><span>${dateText(m.created_at)}</span></div><div class="message-text">${esc(m.text)}</div></article>`).join("");
      const actions=[];if(x.status==="BOT"||x.status==="URGENT_HUMAN")actions.push('<button class="btn primary" data-action="claim">Перехватить</button>');if(x.status==="HUMAN"||x.status==="URGENT_HUMAN")actions.push('<button class="btn" data-action="return">Вернуть боту</button>');if(x.status!=="CLOSED")actions.push('<button class="btn danger" data-action="close">Закрыть</button>');
      detail.innerHTML=`<div class="detail-head"><div class="person"><div class="eyebrow">Диалог #${Number(x.id)}</div><h2>${esc(x.client_name||`Клиент ${x.client_id}`)}</h2><div class="person-meta"><span class="status ${statusClass(x.status)}">${esc(status)}</span></div></div><div class="head-actions">${actions.join("")}</div></div><div class="summary"><div class="summary-item"><span class="summary-label">Телефон</span><div class="summary-value">${esc(x.phone||"Не указан")}</div></div><div class="summary-item"><span class="summary-label">Канал</span><div class="summary-value">${esc(x.channel)}</div></div><div class="summary-item"><span class="summary-label">Сообщений</span><div class="summary-value">${messages.length}</div></div></div><div class="bookings">${bookingHtml}</div><div id="messages" class="messages">${messageHtml||'<div class="list-empty">Сообщений пока нет.</div>'}</div>${x.status==="CLOSED"?'<div class="composer"><div class="person-meta">Диалог закрыт. Верните его боту или откройте новый диалог в Telegram.</div></div>':`<form id="reply-form" class="composer"><label for="reply">Ответ клиенту</label><div class="compose-row"><textarea id="reply" maxlength="4000" placeholder="Напишите сообщение…" required></textarea><button class="btn primary" type="submit">Отправить</button></div><div class="send-hint">Ответ сразу отправится в Telegram, если обращение пришло оттуда.</div></form>`}`;
      const newInput=document.querySelector("#reply");if(newInput){newInput.value=draft;if(hadFocus){newInput.focus({preventScroll:true});newInput.setSelectionRange(selection[0],selection[1])}document.querySelector("#reply-form").addEventListener("submit",sendReply)}
      detail.querySelectorAll("[data-action]").forEach(button=>button.addEventListener("click",()=>changeStatus(button.dataset.action)));
      const newMessages=document.querySelector("#messages");if(newMessages){newMessages.scrollTop=wasAtBottom?newMessages.scrollHeight:Math.min(priorTop,newMessages.scrollHeight)}
    }
    async function openChat(id,preserveDraft=true){const oldInput=document.querySelector("#reply");const preserve={draft:preserveDraft?(oldInput?.value??""):"",focused:preserveDraft&&oldInput===document.activeElement};if(oldInput&&preserve.focused)preserve.selection=[oldInput.selectionStart,oldInput.selectionEnd];current=id;try{const x=await request(`/admin/api/conversations/${id}`);renderConversation(x,preserve);renderList()}catch(error){showNotice(error.message,true)}}
    async function changeStatus(action){if(!current)return;try{await request(`/admin/api/conversations/${current}/${action}`,{method:"POST"});await loadConversations();await openChat(current,true);showNotice(action==="claim"?"Диалог перехвачен.":action==="return"?"Бот снова отвечает.":"Диалог закрыт.")}catch(error){showNotice(error.message,true)}}
    async function sendReply(event){event.preventDefault();const input=document.querySelector("#reply");const text=input.value.trim();if(!text||!current)return;const button=event.submitter;button.disabled=true;try{await request(`/admin/api/conversations/${current}/reply`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});await loadConversations();await openChat(current,false);showNotice("Ответ отправлен.")}catch(error){button.disabled=false;showNotice(error.message,true)}}
    filter.addEventListener("change",renderList);
    loadConversations();
    const stream=new EventSource("/admin/events");stream.addEventListener("ready",()=>document.querySelector("#connection-label").textContent="Подключено");stream.onopen=()=>{document.querySelector("#connection-dot").classList.remove("offline");document.querySelector("#connection-label").textContent="Онлайн"};stream.onerror=()=>{document.querySelector("#connection-dot").classList.add("offline");document.querySelector("#connection-label").textContent="Переподключение"};stream.onmessage=async()=>{await loadConversations();if(current!==null)await openChat(current,true)};
  </script>
</body>
</html>

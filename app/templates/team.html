<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SlotPilot — врачи и график</title>
  <style>
    :root{color-scheme:light;--ink:#17232d;--muted:#697780;--line:#e2e8eb;--paper:#fff;--canvas:#f3f6f7;--brand:#126b62;--brand-dark:#0b514b;--red:#a9372b;--shadow:0 12px 35px #23363d0c}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.topbar{height:68px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1250px)/2));position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:-.02em}.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0}.topnav{display:flex;gap:8px}.topnav a{padding:9px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:650}.topnav a:hover,.topnav a.active{background:#eef6f5;color:var(--brand)}.workspace{max-width:1250px;margin:0 auto;padding:28px 24px 48px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.11em;font-weight:750;color:var(--muted)}h1{font-size:28px;letter-spacing:-.04em;margin:4px 0}.subtitle{color:var(--muted);margin:4px 0 0}.head-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 14px;font-weight:650}.btn:hover{background:#f7f9f9}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-dark)}.btn.danger{color:var(--red);border-color:#f0d2cc}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0}.staff-panel{padding:16px;height:max-content}.staff-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.staff-heading h2{font-size:15px;margin:0}.count{background:#edf2f3;color:#43545d;border-radius:20px;padding:3px 9px;font-size:12px;font-weight:700}.staff-list{display:grid;gap:5px}.staff-item{width:100%;text-align:left;border:1px solid transparent;border-radius:10px;background:transparent;padding:11px;color:inherit}.staff-item:hover{background:#f7f9f9}.staff-item.active{background:#eef6f5;border-color:#d8ebe7}.staff-name{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.staff-meta{display:block;color:var(--muted);font-size:12px;margin-top:3px}.editor{padding:22px;min-height:540px}.empty{height:100%;min-height:440px;display:grid;place-items:center;text-align:center;color:var(--muted);padding:30px}.empty-mark{width:56px;height:56px;margin:0 auto 14px;border-radius:18px;background:#e9f1f1;color:var(--brand);display:grid;place-items:center;font-size:24px}.empty h2{color:var(--ink);font-size:19px;margin:0 0 6px}.identity{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px}.field label,.field-label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;color:var(--ink);background:#fff}.field input:focus{outline:0;border-color:#70a9a0;box-shadow:0 0 0 3px #126b6212}.field input:read-only{background:#f5f7f8;color:var(--muted)}.section{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}.section h2{font-size:17px;letter-spacing:-.02em;margin:0}.section p{font-size:12px;color:var(--muted);margin:4px 0}.service-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.service-choice{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:10px;padding:11px;cursor:pointer}.service-choice input{margin-top:3px;accent-color:var(--brand)}.service-choice strong{display:block;font-size:13px}.service-choice small{color:var(--muted)}.day-list{display:grid;gap:9px}.day-card{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;border:1px solid var(--line);border-radius:11px;padding:12px}.day-label{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px}.day-label input{accent-color:var(--brand)}.day-content{min-width:0}.interval-list{display:grid;gap:7px}.interval-row{display:flex;align-items:center;gap:8px}.interval-row input{border:1px solid var(--line);border-radius:8px;padding:8px 9px;min-width:0}.interval-row span{font-size:12px;color:var(--muted)}.remove-interval{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:4px 7px}.remove-interval:hover{color:var(--red)}.add-interval{border:0;background:transparent;color:var(--brand);font-size:12px;font-weight:700;padding:7px 0 0}.timezone{background:#f5f8f8;border-radius:9px;padding:10px 12px;color:var(--muted);font-size:12px;margin-bottom:14px}.notice{position:fixed;right:22px;bottom:20px;background:#17232d;color:white;padding:11px 15px;border-radius:10px;box-shadow:var(--shadow);z-index:10;max-width:min(420px,90vw)}.notice.error{background:#8f2d25}.hidden{display:none!important}
    @media(max-width:760px){.topbar{padding:0 15px}.brand small{display:none}.topnav a{padding:8px;font-size:12px}.workspace{padding:20px 13px 35px}.layout{grid-template-columns:1fr}.staff-panel{order:2}.editor{order:1}.staff-list{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.page-head{display:block}.head-actions{margin-top:14px}.identity{grid-template-columns:1fr}.day-card{grid-template-columns:1fr;gap:8px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">S</span><span>SlotPilot<small>Настройки клиники</small></span></div>
    <nav class="topnav"><a href="/admin">Диалоги</a><a class="active" href="/admin/team">Врачи и график</a></nav>
  </header>
  <main class="workspace">
    <header class="page-head">
      <div><div class="eyebrow" id="business-name">Клиника</div><h1>Врачи и график</h1><p class="subtitle">Настройте, кто принимает, когда работает и какие услуги выполняет.</p></div>
      <div class="head-actions"><button id="add-doctor" class="btn">Добавить врача</button><button id="save-team" class="btn primary">Сохранить изменения</button></div>
    </header>
    <div class="layout">
      <aside class="panel staff-panel"><div class="staff-heading"><h2>Специалисты</h2><span id="staff-count" class="count">0</span></div><div id="staff-list" class="staff-list"><div class="subtitle">Загружаю…</div></div></aside>
      <section class="panel editor" id="editor"><div class="empty"><div><div class="empty-mark">＋</div><h2>Добавьте врача</h2><div>Затем задайте расписание и доступные услуги.</div></div></div></section>
    </div>
  </main>
  <div id="notice" class="notice" hidden></div>
  <script>
    const days=["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
    let data=null,activeId=null,noticeTimer=null;
    const staffList=document.querySelector("#staff-list"),editor=document.querySelector("#editor");
    function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
    function notice(message,error=false){const box=document.querySelector("#notice");box.textContent=message;box.classList.toggle("error",error);box.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>box.hidden=true,4500)}
    async function request(url,options={}){const response=await fetch(url,options);let body={};try{body=await response.json()}catch{}if(!response.ok){const detail=Array.isArray(body.detail)?body.detail.map(item=>item.msg).join("; "):body.detail;throw new Error(detail||`Ошибка ${response.status}`)}return body}
    function newInterval(start="09:00",end="18:00"){return `<div class="interval-row"><input type="time" data-start value="${esc(start)}" aria-label="Начало"><span>до</span><input type="time" data-end value="${esc(end)}" aria-label="Окончание"><button type="button" class="remove-interval" title="Убрать интервал" aria-label="Убрать интервал">×</button></div>`}
    function scheduleFor(specialist,day){return specialist.schedule[String(day)]||specialist.schedule[day]||[]}
    function renderList(){document.querySelector("#staff-count").textContent=String(data.specialists.length);if(!data.specialists.length){staffList.innerHTML='<div class="subtitle">Пока нет врачей.</div>';return}staffList.innerHTML=data.specialists.map(item=>{const daysCount=Object.keys(item.schedule).length;return `<button class="staff-item ${item.id===activeId?"active":""}" data-id="${esc(item.id)}"><span class="staff-name">${esc(item.name||item.id)}</span><span class="staff-meta">${daysCount} рабочих ${daysCount===1?"день":"дней"}</span></button>`}).join("");staffList.querySelectorAll("[data-id]").forEach(button=>button.addEventListener("click",()=>openDoctor(button.dataset.id)))}
    function renderDoctor(specialist){activeId=specialist.id;editor.innerHTML=`<form id="doctor-form"><div class="identity"><div class="field"><label for="doctor-id">ID в системе</label><input id="doctor-id" value="${esc(specialist.id)}" ${specialist.id.startsWith("new-")?"":"readonly"} pattern="[a-z0-9_-]+" required></div><div class="field"><label for="doctor-name">Имя и специализация</label><input id="doctor-name" maxlength="120" value="${esc(specialist.name)}" placeholder="Например, Иванов Иван — терапевт" required></div></div><section class="section"><div class="section-head"><div><h2>Услуги</h2><p>Отметьте услуги, которые врач может проводить.</p></div></div><div class="service-grid">${data.services.map(service=>`<label class="service-choice"><input type="checkbox" data-service="${esc(service.id)}" ${service.specialist_ids.includes(specialist.id)?"checked":""}><span><strong>${esc(service.name)}</strong><small>${service.price} ₽ · ${service.duration_min} мин</small></span></label>`).join("")||'<div class="subtitle">Сначала добавьте услуги в конфигурацию.</div>'}</div></section><section class="section"><div class="section-head"><div><h2>Рабочие дни и часы</h2><p>Можно указать несколько интервалов за день, например до и после перерыва.</p></div></div><div class="timezone">Часовой пояс клиники: <strong>${esc(data.timezone)}</strong>. Время ниже задаётся по нему.</div><div class="day-list">${days.map((name,day)=>{const intervals=scheduleFor(specialist,day);const enabled=intervals.length>0;return `<div class="day-card" data-day="${day}"><label class="day-label"><input type="checkbox" data-enabled ${enabled?"checked":""}><span>${name}</span></label><div class="day-content ${enabled?"":"hidden"}"><div class="interval-list">${(enabled?intervals:[{}]).map(item=>newInterval(item.start||"",item.end||"")).join("")}</div><button type="button" class="add-interval">+ Добавить интервал</button></div></div>`}).join("")}</div></section><section class="section head-actions"><button id="remove-doctor" type="button" class="btn danger">Удалить врача</button></section></form>`;
      editor.querySelectorAll(".day-card").forEach(card=>{const toggle=card.querySelector("[data-enabled]");toggle.addEventListener("change",()=>{card.querySelector(".day-content").classList.toggle("hidden",!toggle.checked)})});editor.querySelectorAll(".add-interval").forEach(button=>button.addEventListener("click",()=>{const card=button.closest(".day-card");card.querySelector("[data-enabled]").checked=true;card.querySelector(".day-content").classList.remove("hidden");card.querySelector(".interval-list").insertAdjacentHTML("beforeend",newInterval())}));editor.querySelectorAll(".remove-interval").forEach(button=>button.addEventListener("click",()=>{const card=button.closest(".day-card"),rows=card.querySelectorAll(".interval-row");if(rows.length===1){card.querySelector("[data-enabled]").checked=false;card.querySelector(".day-content").classList.add("hidden")}else button.closest(".interval-row").remove()}));editor.querySelector("#remove-doctor").addEventListener("click",removeDoctor);renderList()}
    function syncActive(){if(activeId===null)return true;const form=editor.querySelector("#doctor-form");if(!form)return true;const oldId=activeId,newId=form.querySelector("#doctor-id").value.trim(),name=form.querySelector("#doctor-name").value.trim();if(!/^[a-z0-9_-]+$/.test(newId)){notice("ID: только строчные латинские буквы, цифры, _ и -.",true);return false}if(data.specialists.some(item=>item.id===newId&&item.id!==oldId)){notice("Такой ID врача уже используется.",true);return false}if(!name){notice("Укажите имя врача и специализацию.",true);return false}const specialist=data.specialists.find(item=>item.id===oldId);if(!specialist)return true;specialist.id=newId;specialist.name=name;if(newId!==oldId){for(const service of data.services){service.specialist_ids=service.specialist_ids.map(id=>id===oldId?newId:id)}}const schedule={};for(const card of form.querySelectorAll(".day-card")){if(!card.querySelector("[data-enabled]").checked)continue;const intervals=[...card.querySelectorAll(".interval-row")].map(row=>({start:row.querySelector("[data-start]").value,end:row.querySelector("[data-end]").value}));if(!intervals.length||intervals.some(item=>!item.start||!item.end)){notice(`Заполните начало и конец интервала: ${days[Number(card.dataset.day)]}.`,true);return false}schedule[card.dataset.day]=intervals}specialist.schedule=schedule;for(const checkbox of form.querySelectorAll("[data-service]")){const service=data.services.find(item=>item.id===checkbox.dataset.service);if(!service)continue;service.specialist_ids=service.specialist_ids.filter(id=>id!==newId);if(checkbox.checked)service.specialist_ids.push(newId)}activeId=newId;return true}
    function openDoctor(id){if(!syncActive())return;const specialist=data.specialists.find(item=>item.id===id);if(specialist)renderDoctor(specialist);else renderList()}
    function addDoctor(){if(!syncActive())return;const id=`new-${Date.now()}`;data.specialists.push({id,name:"",schedule:{}});renderDoctor(data.specialists.at(-1));editor.querySelector("#doctor-id").focus();notice("Заполните ID, имя, услуги и график нового врача.")}
    function removeDoctor(){if(!syncActive())return;const removed=activeId;data.specialists=data.specialists.filter(item=>item.id!==removed);for(const service of data.services)service.specialist_ids=service.specialist_ids.filter(id=>id!==removed);activeId=data.specialists[0]?.id||null;if(activeId)renderDoctor(data.specialists[0]);else{editor.innerHTML='<div class="empty"><div><div class="empty-mark">＋</div><h2>Добавьте врача</h2><div>Затем задайте расписание и доступные услуги.</div></div></div>';renderList()}notice("Врач убран из формы. Нажмите «Сохранить изменения», чтобы применить.")}
    async function saveTeam(){if(!syncActive())return;try{await request("/admin/api/team",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({specialists:data.specialists,service_specialists:Object.fromEntries(data.services.map(service=>[service.id,service.specialist_ids]))})});await load();notice("Врачи и расписание сохранены на этом компьютере.")}catch(error){notice(error.message,true)}}
    async function load(){try{data=await request("/admin/api/team");document.querySelector("#business-name").textContent=data.business_name;activeId=data.specialists[0]?.id||null;renderList();if(activeId)renderDoctor(data.specialists[0]);else editor.innerHTML='<div class="empty"><div><div class="empty-mark">＋</div><h2>Добавьте врача</h2><div>Затем задайте расписание и доступные услуги.</div></div></div>'}catch(error){notice(error.message,true);staffList.textContent="Не удалось загрузить настройки."}}
    document.querySelector("#add-doctor").addEventListener("click",addDoctor);document.querySelector("#save-team").addEventListener("click",saveTeam);load();
  </script>
</body>
</html>
